# ci.yml: every push / PR runs the pure-Lua suites (lua5.4, no framework)
# and checks Lua formatting against the repo's stylua.toml.
name: ci

on:
  push:
    # default branch is master; dev is the daily branch
    branches: [master, dev]
  pull_request:
    # run for PRs targeting any branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: unit specs
        run: lua5.4 tests/run.lua
      - name: end-to-end suite
        run: lua5.4 tests/run_e2e.lua
      - name: README spec checks
        run: lua5.4 tests/run_spec_check.lua .

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stylua check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.20.0
          args: --check .
